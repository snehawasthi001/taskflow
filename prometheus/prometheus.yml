global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: taskflow-frontend-compose
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:3000"]
        labels:
          service: frontend
          environment: local

  - job_name: taskflow-backend-compose
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: backend
          environment: local

  # Use prometheus-kubernetes.yml when Prometheus runs inside EKS/minikube.
