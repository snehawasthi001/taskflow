apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
type: Opaque
stringData:
  # Replace these placeholders in Jenkins or with kubectl before production deploys.
  DATABASE_URL: "postgresql://user:password@neon-host/taskflow?sslmode=require"
  REDIS_URL: "rediss://default:password@upstash-host:6379"
  NEXTAUTH_SECRET: "replace-with-32-byte-secret"
  NEXTAUTH_URL: "https://taskflow.example.com"
  JWT_SECRET: "replace-with-jwt-secret"
