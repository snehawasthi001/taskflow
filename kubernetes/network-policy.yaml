apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskflow-default-deny
  namespace: taskflow
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskflow-allow-app-traffic
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taskflow
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: UDP
          port: 53
