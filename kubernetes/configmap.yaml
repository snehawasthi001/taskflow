apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
data:
  NODE_ENV: "production"
  FRONTEND_PORT: "3000"
  BACKEND_PORT: "3001"
  NEXT_PUBLIC_API_URL: "https://taskflow.example.com/api"
  NEXT_PUBLIC_WS_URL: "wss://taskflow.example.com"
  METRICS_PATH: "/metrics"
  LOG_LEVEL: "info"
